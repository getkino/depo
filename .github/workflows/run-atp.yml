name: Run atp.py inside workflow (every 2 hours)

on:
  schedule:
    - cron: '0 */2 * * *'   # her 2 saatte bir
  workflow_dispatch: {}     # manuel tetikleme

permissions:
  contents: write

jobs:
  run-atp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with creds)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 lxml || true
        shell: bash

      - name: Ensure atp dir exists
        run: |
          mkdir -p atp
          mkdir -p atp/playlists
          mkdir -p atp/logs
          touch atp/.placeholder
        shell: bash

      - name: Run atp script and write logs into atp/logs
        id: run_atp
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          LOGFILE="atp/logs/atp_run_${TIMESTAMP}.log"
          echo "Running atp/atp.py at ${TIMESTAMP} (UTC)" > "$LOGFILE"
          python atp/atp.py >> "$LOGFILE" 2>&1 || echo "Script exited with non-zero status" >> "$LOGFILE"
          tail -n 200 "$LOGFILE"
        shell: bash

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: atp-logs
          path: atp/logs/

      - name: Stage atp/ outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A atp || true
          echo "staged=true" >> $GITHUB_OUTPUT
        shell: bash

      - name: Commit & try push with GITHUB_TOKEN
        id: try_push
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(atp): update generated files under atp/ [ci skip]" || true
            if git push origin HEAD; then
              echo "pushed=true" >> $GITHUB_OUTPUT
            else
              echo "pushed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fallback — create branch & PR using PUSH_PAT if push failed
        if: steps.try_push.outputs.pushed == 'false'
        env:
          PUSH_PAT: ${{ secrets.PUSH_PAT }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -z "$PUSH_PAT" ]; then
            echo "PUSH_PAT not set — cannot push or create PR. Exiting."
            exit 0
          fi
          git remote set-url origin https://x-access-token:${PUSH_PAT}@github.com/${REPO}.git
          BRANCH="atp/auto-update-$(date -u +'%Y%m%dT%H%M%SZ')"
          git checkout -b "$BRANCH" || git checkout "$BRANCH" || true
          git add -A atp || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(atp): update generated files under atp/ [ci skip]" || true
            git push --set-upstream origin "$BRANCH"
            PAYLOAD=$(jq -n --arg title "chore(atp): update generated files under atp/ (automated)" --arg head "$BRANCH" --arg base "$BASE" '{title: $title, head: $head, base: $base, body: "Automated PR: updates generated by atp script."}')
            curl -s -X POST -H "Authorization: token ${PUSH_PAT}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${REPO}/pulls -d "$PAYLOAD" | tee pr_resp.json
            echo "PR creation response saved to pr_resp.json"
          else
            echo "No changes to commit for PR."
          fi
        shell: bash

      - name: Debug — show atp listing
        run: |
          echo "atp dir:"
          ls -la atp || true
        shell: bash
